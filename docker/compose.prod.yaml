name: eco-planner-production

services:
  # Applies pending prisma migrations before the app starts, so schema-touching
  # merges can't leave the running app ahead of the database. The seed image is
  # reused for its prisma CLI + migrations; its default CMD force-resets the
  # database, so the command override below must stay.
  migrate:
    image: ghcr.io/sustainable-action-foundation/eco-planner-db-seed:${IMAGE_TAG:-edge}
    pull_policy: always
    restart: "no"
    command: ["yarn", "prisma", "migrate", "deploy"]
    networks:
      - default
    environment:
      - DATABASE_URL=${DATABASE_URL:?error}

  app:
    # Deploys pin IMAGE_TAG to the commit (sha-<sha>); manual runs fall back to edge
    image: ghcr.io/sustainable-action-foundation/eco-planner:${IMAGE_TAG:-edge}
    pull_policy: always
    restart: always
    # A failed migrate aborts the deploy before the old app container is replaced
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
    ports:
      - "8081:8081"
    environment:
      # Database connection string
      - DATABASE_URL=${DATABASE_URL:?error}
      # Iron session cookie encryption password
      - IRON_SESSION_PASSWORD=${IRON_SESSION_PASSWORD:?error}
      # Used to connect mailClient to SMTP server
      - MAIL_TENANT_ID=${MAIL_TENANT_ID:?error}
      - MAIL_CLIENT_ID=${MAIL_CLIENT_ID:?error}
      - MAIL_CLIENT_SECRET=${MAIL_CLIENT_SECRET:?error}
      - MAIL_USER=${MAIL_USER:?error}
      # Used for links in emails and as canonical url in meta tags
      - BASE_URL=${BASE_URL}