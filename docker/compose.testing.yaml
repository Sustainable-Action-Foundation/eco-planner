name: eco-planner-test-suite

services:
  db:
    # Keep in sync with compose.staging.yaml (pinned after a surprise lts major bump)
    image: mariadb:12.3
    restart: always
    networks:
      # - default
      - testing_network
    # For debugging locally you can uncomment the port mapping below and the default network above,
    # allowing you to access the database from your host machine at localhost:3366.
    # ports:
    #   - "3366:3306"
    volumes:
      - testing_data:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=${TEST_MARIADB_DATABASE:-eco-planner}
      - MARIADB_ROOT_PASSWORD=${TEST_MARIADB_ROOT_PASSWORD:-admin}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 1m
      start_interval: 5s
      interval: 15s
      timeout: 5s
      retries: 10

  db_seed:
    image: eco-planner-db-seed:test
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/db-seed.Dockerfile
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - testing_network
    environment:
      - DATABASE_URL=${TEST_DATABASE_URL:-mysql://root:admin@db:3306/eco-planner}

  s3:
    # S3-compatible object storage for attachments. The posix backend keeps a bucket as a
    # directory, so the bucket is created by making it before the gateway starts.
    image: versity/versitygw:latest
    restart: always
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/${TEST_S3_BUCKET:-attachments} && exec /usr/local/bin/versitygw --port :7070 posix /data"]
    networks:
      - default
      - testing_network
    # Download links are signed for the host address (S3_PUBLIC_ENDPOINT below), which the test browsers follow
    ports:
      - "9100:7070"
    environment:
      - ROOT_ACCESS_KEY=${TEST_S3_ACCESS_KEY_ID:-test-access-key}
      - ROOT_SECRET_KEY=${TEST_S3_SECRET_ACCESS_KEY:-test-secret-key}

  app:
    image: eco-planner-app:test
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA}
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    restart: always
    depends_on:
      db:
        condition: service_healthy
      db_seed:
        condition: service_completed_successfully
      s3:
        condition: service_started
    networks:
      - default
      - testing_network
    ports:
      - "8081:8081"
    environment:
      # TEST_ENVIRONMENT should affect as little as possible, currently only for setting secure cookie flag to false in session cookies since webkit doesn't exclude localhost from https-requirement for secure cookies, suppressing a console log in health route, and exposing /api/test/db-stats for the query-budget canary.
      - TEST_ENVIRONMENT=testing
      # Database connection string; pool size via ?connection_limit=&pool_timeout= (see caching.md, "Database pool")
      - DATABASE_URL=${TEST_DATABASE_URL:-mysql://root:admin@db:3306/eco-planner}
      # Iron session cookie encryption password
      - IRON_SESSION_PASSWORD=${TEST_IRON_SESSION_PASSWORD:-7LSP6h4CNt9MKjgzxemgvbqQxb6ud5SMaLFfLLBbHxHb9BH7tK79nTmEvs6724kg}
      # Used to connect mailClient to SMTP server
      - MAIL_HOST=${TEST_MAIL_HOST}
      - MAIL_USER=${TEST_MAIL_USER}
      - MAIL_PASSWORD=${TEST_MAIL_PASSWORD}
      # Used for links in emails and as canonical url in meta tags
      - BASE_URL=${TEST_BASE_URL:-http://app:8081}
      # Attachments bucket (the s3 service above); browsers reach it through the published port
      - S3_ENDPOINT=http://s3:7070
      - S3_PUBLIC_ENDPOINT=${TEST_S3_PUBLIC_ENDPOINT:-http://localhost:9100}
      - S3_REGION=us-east-1
      - S3_BUCKET=${TEST_S3_BUCKET:-attachments}
      - S3_ACCESS_KEY_ID=${TEST_S3_ACCESS_KEY_ID:-test-access-key}
      - S3_SECRET_ACCESS_KEY=${TEST_S3_SECRET_ACCESS_KEY:-test-secret-key}
      - COMMIT_SHA=${COMMIT_SHA}

networks:
  testing_network:
    internal: true

volumes:
  testing_data:
    driver: local