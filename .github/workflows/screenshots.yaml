name: run screenshot tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:
    inputs:
      skip_deployment:
        description: "Skip deploy to github pages?"
        required: false
        default: false
        type: boolean

jobs:
  de-duplication:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.decision.outputs.should_skip }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Decide whether this run is a duplicate PR run
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        # If more branches are added to `on.push.branches`, the logic in this run step should be updated to also check if $HEAD_REF matches one of those branches
        run: |
          SHOULD_SKIP="false"
          REASON="not duplicate"

          if [[ "$EVENT_NAME" == "pull_request" \
              && "$IS_FORK_PR" == "false" \
              && ( \
                "$HEAD_REF" == "main" \
                || "$HEAD_REF" == "dev" \
              ) ]]; then
            SHOULD_SKIP="true"
            REASON="pr from on.push branch"
          fi

          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "de-duplication: should_skip=$SHOULD_SKIP reason=$REASON"

  screenshot-tests:
    needs: de-duplication
    if: ${{ needs.de-duplication.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable yarn through corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Set up Node for tests
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: yarn

      - name: Install test dependencies
        run: |
          # Packages
          yarn install --immutable
          # Playwright browsers
          yarn playwright install --with-deps

      - name: Run tests
        id: run-tests
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_IRON_SESSION_PASSWORD: ${{ secrets.TEST_IRON_SESSION_PASSWORD }}
          TEST_MAIL_HOST: ${{ secrets.TEST_MAIL_HOST }}
          TEST_MAIL_USER: ${{ secrets.TEST_MAIL_USER }}
          TEST_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
          TEST_MARIADB_DATABASE: ${{ secrets.TEST_MARIADB_DATABASE }}
          TEST_MARIADB_ROOT_PASSWORD: ${{ secrets.TEST_MARIADB_ROOT_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
          BUILDX_EXPERIMENTAL: 1
        run: |
          yarn test:screenshot

      - name: Build screenshot page
        if: ${{ !cancelled() }}
        run: yarn tsx tests/screenshots/screenshot-templater/viewer.templater.ts

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./tests/out

  deploy:
    needs:
      - de-duplication
      - screenshot-tests
    # Only publish the screenshot viewer to GitHub Pages from main; other refs
    # (PRs, dev, tags) still run the screenshot tests but skip deployment.
    if: ${{ needs.de-duplication.outputs.should_skip != 'true' && !cancelled() && !inputs.skip_deployment && github.ref == 'refs/heads/main' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
