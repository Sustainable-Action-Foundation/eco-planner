name: build and publish docker image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:
    inputs:
      should_push:
        description: "Should the image be pushed to the registry? (uses default tags for the branch)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests?"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sustainable-action-foundation/eco-planner
  SEED_IMAGE_NAME: sustainable-action-foundation/eco-planner-db-seed

jobs:
  de-duplication:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.decision.outputs.should_skip }}
      reason: ${{ steps.decision.outputs.reason }}
      runs_on: ${{ steps.runner.outputs.runs_on }}
    steps:
      - name: Decide whether this run is a duplicate PR run
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        # If more branches are added to `on.push.branches`, the logic in this run step should be updated to also check if $HEAD_REF matches one of those branches
        run: |
          SHOULD_SKIP="false"
          REASON="not duplicate"

          if [[ "$EVENT_NAME" == "pull_request" \
              && "$IS_FORK_PR" == "false" \
              && ( \
                "$HEAD_REF" == "main" \
                || "$HEAD_REF" == "dev" \
              ) ]]; then
            SHOULD_SKIP="true"
            REASON="pr from on.push branch"
          fi

          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "de-duplication: should_skip=$SHOULD_SKIP reason=$REASON"

      - name: Pick the runner for build-and-publish
        id: runner
        # Routes the runner owner's own runs to the self-hosted runner (homelab Proxmox VM) when it is
        # online, and everything else to GitHub-hosted: other contributors, re-runs by someone else,
        # runner offline, or no status token. The health check matters because a job targeting
        # self-hosted with no online runner just queues (for up to 24h) instead of falling back.
        # RUNNER_STATUS_TOKEN is a fine-grained PAT with org permission "Self-hosted runners: read";
        # GITHUB_TOKEN cannot list runners. Without it, every run stays on GitHub-hosted.
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          # Not RUNNER_*: the runner injects its own RUNNER_NAME etc. and those win over step env
          SELF_HOSTED_OWNER: VenaStrom
          SELF_HOSTED_RUNNER: gh-runner-205
        run: |
          RUNS_ON='"ubuntu-latest"'
          REASON="github-hosted"

          if [[ "$ACTOR" != "$SELF_HOSTED_OWNER" || "$TRIGGERING_ACTOR" != "$SELF_HOSTED_OWNER" ]]; then
            REASON="not triggered by $SELF_HOSTED_OWNER"
          elif [[ -z "$GH_TOKEN" ]]; then
            REASON="RUNNER_STATUS_TOKEN not set"
          else
            STATUS=$(gh api "orgs/$ORG/actions/runners" \
              --jq ".runners[] | select(.name == \"$SELF_HOSTED_RUNNER\") | .status" 2>/dev/null || true)
            if [[ "$STATUS" == "online" ]]; then
              RUNS_ON='["self-hosted", "proxmox"]'
              REASON="$SELF_HOSTED_RUNNER is online"
            else
              REASON="$SELF_HOSTED_RUNNER status: ${STATUS:-unknown}"
            fi
          fi

          echo "runs_on=$RUNS_ON" >> "$GITHUB_OUTPUT"
          echo "pick-runner: runs_on=$RUNS_ON reason=$REASON"

  build-and-publish:
    needs: de-duplication
    if: ${{ needs.de-duplication.outputs.should_skip != 'true' }}
    runs-on: ${{ fromJSON(needs.de-duplication.outputs.runs_on) }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history so the commits-since-version-bump count can be computed
          fetch-depth: 0

      - name: Count commits since last version bump
        id: commits-ahead
        run: |
          bump_commit=$(git log -1 --format=%H -G'"version":' -- package.json)
          echo "count=$(git rev-list --count "$bump_commit"..HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true # Set as default builder

      - name: Enable yarn through corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Set up Node for tests
        if: ${{ !inputs.skip_tests }}
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: yarn

      - name: Install test dependencies
        if: ${{ !inputs.skip_tests }}
        run: |
          # Packages
          yarn install --immutable
          # Prisma client (src modules imported by tests reach the generated client)
          yarn prisma generate
          # Playwright browsers. The self-hosted runner has the system deps preinstalled and no sudo,
          # so --with-deps (which calls sudo apt-get) only runs on GitHub-hosted.
          yarn playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }}

      - name: Run tests
        id: run-tests
        if: ${{ !inputs.skip_tests }}
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_IRON_SESSION_PASSWORD: ${{ secrets.TEST_IRON_SESSION_PASSWORD }}
          TEST_MAIL_HOST: ${{ secrets.TEST_MAIL_HOST }}
          TEST_MAIL_USER: ${{ secrets.TEST_MAIL_USER }}
          TEST_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
          TEST_MARIADB_DATABASE: ${{ secrets.TEST_MARIADB_DATABASE }}
          TEST_MARIADB_ROOT_PASSWORD: ${{ secrets.TEST_MARIADB_ROOT_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
          BUILDX_EXPERIMENTAL: 1
        run: |
          yarn test

      - name: Upload test artifacts
        if: ${{ !cancelled() && steps.run-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          # Relative to the workspace; an absolute /test-results/ never matches
          # anything, silently uploading no failure traces.
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Setup docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Pinned to main: prod pulls :edge, and a bare type=edge follows the
            # repo's default branch — flipping the default to dev must not
            # repoint prod's tag
            type=edge,branch=main
            type=ref,event=branch
            # Immutable per-commit tag; deploys pin this so rollback = redeploy an older run
            type=sha,format=long
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Setup docker metadata for seed image
        id: seed-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SEED_IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/app.Dockerfile
          # Don't push on pull requests, after failed (non-skipped) tests, or on manual workflow dispatches without the `should_push` input set to true
          push: ${{ steps.run-tests.outcome != 'failed' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}
            COMMITS_AHEAD=${{ steps.commits-ahead.outputs.count }}
          # Self-hosted: local layer cache on the runner's disk (the GHA cache backend is the slow part
          # there); written to a -new dir and rotated in below so a failed build can't corrupt it.
          cache-from: ${{ runner.environment == 'self-hosted' && 'type=local,src=/home/runner/buildx-cache/app' || 'type=gha' }}
          cache-to: ${{ runner.environment == 'self-hosted' && 'type=local,dest=/home/runner/buildx-cache/app-new,mode=max' || 'type=gha,mode=max' }}

      - name: Build and push seed image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/db-seed.Dockerfile
          push: ${{ steps.run-tests.outcome != 'failed' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
          tags: ${{ steps.seed-metadata.outputs.tags }}
          labels: ${{ steps.seed-metadata.outputs.labels }}
          cache-from: ${{ runner.environment == 'self-hosted' && 'type=local,src=/home/runner/buildx-cache/seed' || 'type=gha' }}
          cache-to: ${{ runner.environment == 'self-hosted' && 'type=local,dest=/home/runner/buildx-cache/seed-new,mode=max' || 'type=gha,mode=max' }}

      - name: Rotate local buildx cache
        if: ${{ runner.environment == 'self-hosted' && !cancelled() }}
        run: |
          for c in app seed; do
            if [[ -d "/home/runner/buildx-cache/$c-new" ]]; then
              rm -rf "/home/runner/buildx-cache/$c"
              mv "/home/runner/buildx-cache/$c-new" "/home/runner/buildx-cache/$c"
            fi
          done

  deploy-staging:
    needs: build-and-publish
    # Deploys on dev pushes (and manual dispatches on dev that pushed an image)
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.should_push == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.BASE_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v6
        with:
          sparse-checkout: docker

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key

      - name: Render environment file
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          MAIL_CLIENT_SECRET: ${{ secrets.MAIL_CLIENT_SECRET }}
          MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE }}
          MAIL_TENANT_ID: ${{ vars.MAIL_TENANT_ID }}
          MAIL_CLIENT_ID: ${{ vars.MAIL_CLIENT_ID }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          BASE_URL: ${{ vars.BASE_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'IRON_SESSION_PASSWORD=%s\n' "$IRON_SESSION_PASSWORD"
            printf 'MARIADB_DATABASE=%s\n' "$MARIADB_DATABASE"
            printf 'MARIADB_ROOT_PASSWORD=%s\n' "$MARIADB_ROOT_PASSWORD"
            printf 'MAIL_TENANT_ID=%s\n' "$MAIL_TENANT_ID"
            printf 'MAIL_CLIENT_ID=%s\n' "$MAIL_CLIENT_ID"
            printf 'MAIL_CLIENT_SECRET=%s\n' "$MAIL_CLIENT_SECRET"
            printf 'MAIL_USER=%s\n' "$MAIL_USER"
            printf 'BASE_URL=%s\n' "$BASE_URL"
            printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
            printf 'S3_REGION=%s\n' "$S3_REGION"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
          } > deploy.env

      - name: Deploy
        env:
          SSH_DEST: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$SSH_DEST" 'mkdir -p ~/eco-planner'
          $SSH "$SSH_DEST" 'install -m 600 /dev/stdin ~/eco-planner/.env' < deploy.env
          $SSH "$SSH_DEST" 'cat > ~/eco-planner/compose.yaml' < docker/compose.staging.yaml
          # Prune before pulling, and with -a: every deploy pulls new sha-tagged images, which never become
          # dangling, and a prune that only runs after a successful `up` can't rescue a host whose disk is
          # already full (the seed dies on ENOSPC). Images used by the running stack survive the prune.
          $SSH "$SSH_DEST" 'cd ~/eco-planner && docker image prune -a -f && docker compose --env-file .env pull --quiet && docker compose --env-file .env up -d --wait --wait-timeout 300'

  deploy-production:
    needs: build-and-publish
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.should_push == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The production environment's required reviewers gate this job
    environment:
      name: production
      url: ${{ vars.BASE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v6
        with:
          sparse-checkout: docker

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key

      - name: Render environment file
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}
          MAIL_CLIENT_SECRET: ${{ secrets.MAIL_CLIENT_SECRET }}
          MAIL_TENANT_ID: ${{ vars.MAIL_TENANT_ID }}
          MAIL_CLIENT_ID: ${{ vars.MAIL_CLIENT_ID }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          BASE_URL: ${{ vars.BASE_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'IRON_SESSION_PASSWORD=%s\n' "$IRON_SESSION_PASSWORD"
            printf 'MAIL_TENANT_ID=%s\n' "$MAIL_TENANT_ID"
            printf 'MAIL_CLIENT_ID=%s\n' "$MAIL_CLIENT_ID"
            printf 'MAIL_CLIENT_SECRET=%s\n' "$MAIL_CLIENT_SECRET"
            printf 'MAIL_USER=%s\n' "$MAIL_USER"
            printf 'BASE_URL=%s\n' "$BASE_URL"
            printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
            printf 'S3_REGION=%s\n' "$S3_REGION"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
          } > deploy.env

      - name: Deploy
        env:
          SSH_DEST: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$SSH_DEST" 'mkdir -p ~/eco-planner'
          $SSH "$SSH_DEST" 'install -m 600 /dev/stdin ~/eco-planner/.env' < deploy.env
          $SSH "$SSH_DEST" 'cat > ~/eco-planner/compose.yaml' < docker/compose.prod.yaml
          # Prune before pulling, and with -a: every deploy pulls new sha-tagged images, which never become
          # dangling, and a prune that only runs after a successful `up` can't rescue a host whose disk is
          # already full (the seed dies on ENOSPC). Images used by the running stack survive the prune.
          $SSH "$SSH_DEST" 'cd ~/eco-planner && docker image prune -a -f && docker compose --env-file .env pull --quiet && docker compose --env-file .env up -d --wait --wait-timeout 300'
