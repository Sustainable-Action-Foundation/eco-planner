name: build and publish docker image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:
    inputs:
      should_push:
        description: "Should the image be pushed to the registry? (uses default tags for the branch)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests?"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sustainable-action-foundation/eco-planner
  SEED_IMAGE_NAME: sustainable-action-foundation/eco-planner-db-seed

jobs:
  de-duplication:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.decision.outputs.should_skip }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Decide whether this run is a duplicate PR run
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        # If more branches are added to `on.push.branches`, the logic in this run step should be updated to also check if $HEAD_REF matches one of those branches
        run: |
          SHOULD_SKIP="false"
          REASON="not duplicate"

          if [[ "$EVENT_NAME" == "pull_request" \
              && "$IS_FORK_PR" == "false" \
              && ( \
                "$HEAD_REF" == "main" \
                || "$HEAD_REF" == "dev" \
              ) ]]; then
            SHOULD_SKIP="true"
            REASON="pr from on.push branch"
          fi

          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "de-duplication: should_skip=$SHOULD_SKIP reason=$REASON"

  build-and-publish:
    needs: de-duplication
    if: ${{ needs.de-duplication.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true # Set as default builder

      - name: Enable yarn through corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Set up Node for tests
        if: ${{ !inputs.skip_tests }}
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: yarn

      - name: Install test dependencies
        if: ${{ !inputs.skip_tests }}
        run: |
          # Packages
          yarn install --immutable
          # Prisma client (src modules imported by tests reach the generated client)
          yarn prisma generate
          # Playwright browsers
          yarn playwright install --with-deps

      - name: Run tests
        id: run-tests
        if: ${{ !inputs.skip_tests }}
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_IRON_SESSION_PASSWORD: ${{ secrets.TEST_IRON_SESSION_PASSWORD }}
          TEST_MAIL_HOST: ${{ secrets.TEST_MAIL_HOST }}
          TEST_MAIL_USER: ${{ secrets.TEST_MAIL_USER }}
          TEST_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
          TEST_MARIADB_DATABASE: ${{ secrets.TEST_MARIADB_DATABASE }}
          TEST_MARIADB_ROOT_PASSWORD: ${{ secrets.TEST_MARIADB_ROOT_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
          BUILDX_EXPERIMENTAL: 1
        run: |
          yarn test

      - name: Upload test artifacts
        if: ${{ !cancelled() && steps.run-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          # Relative to the workspace; an absolute /test-results/ never matches
          # anything, silently uploading no failure traces.
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Setup docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge
            type=ref,event=branch
            # Immutable per-commit tag; deploys pin this so rollback = redeploy an older run
            type=sha,format=long
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Setup docker metadata for seed image
        id: seed-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SEED_IMAGE_NAME }}
          tags: |
            type=edge
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/app.Dockerfile
          # Don't push on pull requests, after failed (non-skipped) tests, or on manual workflow dispatches without the `should_push` input set to true
          push: ${{ steps.run-tests.outcome != 'failed' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push seed image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/db-seed.Dockerfile
          push: ${{ steps.run-tests.outcome != 'failed' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
          tags: ${{ steps.seed-metadata.outputs.tags }}
          labels: ${{ steps.seed-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-publish
    # Deploys on dev pushes (and manual dispatches on dev that pushed an image)
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.should_push == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.BASE_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v6
        with:
          sparse-checkout: docker

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key

      - name: Render environment file
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          MAIL_CLIENT_SECRET: ${{ secrets.MAIL_CLIENT_SECRET }}
          MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE }}
          MAIL_TENANT_ID: ${{ vars.MAIL_TENANT_ID }}
          MAIL_CLIENT_ID: ${{ vars.MAIL_CLIENT_ID }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'IRON_SESSION_PASSWORD=%s\n' "$IRON_SESSION_PASSWORD"
            printf 'MARIADB_DATABASE=%s\n' "$MARIADB_DATABASE"
            printf 'MARIADB_ROOT_PASSWORD=%s\n' "$MARIADB_ROOT_PASSWORD"
            printf 'MAIL_TENANT_ID=%s\n' "$MAIL_TENANT_ID"
            printf 'MAIL_CLIENT_ID=%s\n' "$MAIL_CLIENT_ID"
            printf 'MAIL_CLIENT_SECRET=%s\n' "$MAIL_CLIENT_SECRET"
            printf 'MAIL_USER=%s\n' "$MAIL_USER"
            printf 'BASE_URL=%s\n' "$BASE_URL"
          } > deploy.env

      - name: Deploy
        env:
          SSH_DEST: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$SSH_DEST" 'mkdir -p ~/eco-planner'
          $SSH "$SSH_DEST" 'install -m 600 /dev/stdin ~/eco-planner/.env' < deploy.env
          $SSH "$SSH_DEST" 'cat > ~/eco-planner/compose.yaml' < docker/compose.staging.yaml
          $SSH "$SSH_DEST" 'cd ~/eco-planner && docker compose --env-file .env pull --quiet && docker compose --env-file .env up -d --wait --wait-timeout 300 && docker image prune -f'

  deploy-production:
    needs: build-and-publish
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.should_push == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The production environment's required reviewers gate this job
    environment:
      name: production
      url: ${{ vars.BASE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v6
        with:
          sparse-checkout: docker

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key

      - name: Render environment file
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}
          MAIL_CLIENT_SECRET: ${{ secrets.MAIL_CLIENT_SECRET }}
          MAIL_TENANT_ID: ${{ vars.MAIL_TENANT_ID }}
          MAIL_CLIENT_ID: ${{ vars.MAIL_CLIENT_ID }}
          MAIL_USER: ${{ vars.MAIL_USER }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'IRON_SESSION_PASSWORD=%s\n' "$IRON_SESSION_PASSWORD"
            printf 'MAIL_TENANT_ID=%s\n' "$MAIL_TENANT_ID"
            printf 'MAIL_CLIENT_ID=%s\n' "$MAIL_CLIENT_ID"
            printf 'MAIL_CLIENT_SECRET=%s\n' "$MAIL_CLIENT_SECRET"
            printf 'MAIL_USER=%s\n' "$MAIL_USER"
            printf 'BASE_URL=%s\n' "$BASE_URL"
          } > deploy.env

      - name: Deploy
        env:
          SSH_DEST: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$SSH_DEST" 'mkdir -p ~/eco-planner'
          $SSH "$SSH_DEST" 'install -m 600 /dev/stdin ~/eco-planner/.env' < deploy.env
          $SSH "$SSH_DEST" 'cat > ~/eco-planner/compose.yaml' < docker/compose.prod.yaml
          $SSH "$SSH_DEST" 'cd ~/eco-planner && docker compose --env-file .env pull --quiet && docker compose --env-file .env up -d --wait --wait-timeout 300 && docker image prune -f'
