name: build and publish docker image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:
    inputs:
      should_push:
        description: "Should the image be pushed to the registry? (uses default tags for the branch)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests?"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sustainable-action-foundation/eco-planner

jobs:
  de-duplication:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.decision.outputs.should_skip }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Decide whether this run is a duplicate PR run
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        # If more branches are added to `on.push.branches`, the logic in this run step should be updated to also check if $HEAD_REF matches one of those branches
        run: |
          SHOULD_SKIP="false"
          REASON="not-duplicate"

          if [[ "$EVENT_NAME" == "pull_request" \
              && "$IS_FORK_PR" == "false" \
              && ( \
                "$HEAD_REF" == "main" \
                || "$HEAD_REF" == "dev" \
              ) ]]; then
            SHOULD_SKIP="true"
            REASON="pr-between-push-and-pr-branches"
          fi

          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "de-duplication: should_skip=$SHOULD_SKIP reason=$REASON"

  build-and-publish:
    needs: de-duplication
    if: ${{ needs.de-duplication.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true # Set as default builder

      - name: Enable yarn through corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Set up Node for tests
        if: ${{ !inputs.skip_tests }}
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: yarn

      - name: Install test dependencies
        if: ${{ !inputs.skip_tests }}
        run: |
          # Packages
          yarn install --immutable
          # Playwright browsers
          yarn playwright install --with-deps

      - name: Run tests
        id: run-tests
        if: ${{ !inputs.skip_tests }}
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_IRON_SESSION_PASSWORD: ${{ secrets.TEST_IRON_SESSION_PASSWORD }}
          TEST_MAIL_HOST: ${{ secrets.TEST_MAIL_HOST }}
          TEST_MAIL_USER: ${{ secrets.TEST_MAIL_USER }}
          TEST_MAIL_PASSWORD: ${{ secrets.TEST_MAIL_PASSWORD }}
          TEST_MARIADB_DATABASE: ${{ secrets.TEST_MARIADB_DATABASE }}
          TEST_MARIADB_ROOT_PASSWORD: ${{ secrets.TEST_MARIADB_ROOT_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
          BUILDX_EXPERIMENTAL: 1
        run: |
          yarn test

      - name: Upload test artifacts
        if: ${{ !cancelled() && steps.run-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: /test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Setup docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge
            type=ref,event=branch
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/app.Dockerfile
          # Don't push on pull requests, after failed (non-skipped) tests, or on manual workflow dispatches without the `should_push` input set to true
          push: ${{ steps.run-tests.outcome != 'failed' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.should_push == true) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
